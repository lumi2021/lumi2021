name: Update README

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Executar Composite Action
        uses: lumi2021-silly-workflows/markdown-plus@main
        with:
          wakatime_api_key: ${{ secrets.WAKATIME_API_KEY }}
          github_api_token: ${{ secrets.GH_API_KEY }}
          github_username: ${{ secrets.GH_USERNAME }}
          steam_api_key: ${{ secrets.STEAM_API_KEY }}
          steam_user_id: ${{ secrets.STEAM_USER_ID }}
          lastfm_api_key: ${{ secrets.LAST_FM_API_KEY }}
          lastfm_username: ${{ secrets.LAST_FM_USERNAME }}

      - name: Limpar pasta temporária do app
        run: rm -rf .md-plus-app

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git add actions
          git diff --staged --quiet || (git commit -m "docs: auto update README.md" && git push)